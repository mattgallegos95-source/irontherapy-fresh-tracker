<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iron Therapy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="hero">
  <div class="brand">
    <div class="logo-mark">
      <img src="logo.jpg" alt="Iron Therapy Logo">
    </div>
    <div>
      <h1>Iron Therapy</h1>
      <p class="sub">Earn It Every Day.</p>
    </div>
  </div>

  <div class="hero-actions">
    <select id="yearSelect"></select>
  </div>
</header>

<main class="app-shell">
  <section class="calendar-card">
    <div class="calendar-top">
      <button id="prevMonth">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth">›</button>
    </div>

    <div class="weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>

    <div id="calendar" class="calendar"></div>
  </section>

  <section class="day-card">
    <div class="day-header">
      <div>
        <h2 id="selectedDateTitle">Select a day</h2>
        <p id="completionSummary">Track your fitness, meals, and tasks.</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="fitness">Fitness</button>
      <button class="tab" data-tab="nutrition">Nutrition</button>
      <button class="tab" data-tab="tasks">Daily Tasks</button>
    </div>

    <section id="fitness" class="tab-content active">
      <div class="panel">
        <h3>Daily Fitness Photo</h3>
        <input type="file" id="fitnessPhotoInput" accept="image/*">
        <img id="fitnessPhotoPreview" class="photo-preview"/>
      </div>

      <div class="panel">
        <h3>Today's Workout</h3>

        <label>Select workout day</label>
        <select id="workoutSelect"></select>

        <button id="loadWorkoutBtn">Load Workout</button>
      </div>

      <div class="panel">
        <div class="section-inline">
          <h3>Workout Exercises</h3>
          <button id="addExerciseBtn">+ Add Exercise</button>
        </div>

        <div id="exerciseList"></div>
      </div>

      <div class="panel">
        <div class="section-inline">
          <h3>Abs</h3>
          <label><input type="checkbox" id="absEnabled"> Add Abs</label>
        </div>

        <div id="absList"></div>
      </div>

      <div class="panel">
        <div class="section-inline">
          <h3>Cardio</h3>
          <label><input type="checkbox" id="cardioEnabled"> Add Cardio</label>
        </div>

        <div id="cardioFields">
          <input id="cardioType" placeholder="Type of cardio">
          <input id="cardioDuration" placeholder="Duration">
          <input id="cardioDistance" placeholder="Distance">
          <input id="cardioCalories" placeholder="Calories burned">
        </div>
      </div>
    </section>

    <section id="nutrition" class="tab-content">
      <div class="panel">
        <div class="section-inline">
          <h3>Nutrition</h3>
          <button id="addMealBtn">+ Add Meal</button>
        </div>

        <div id="mealList"></div>
      </div>
    </section>

    <section id="tasks" class="tab-content">
      <div class="panel">
        <div class="section-inline">
          <h3>Daily Tasks</h3>
          <button id="addTaskBtn">+ Add Task</button>
        </div>

        <div id="taskList"></div>
      </div>
    </section>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
